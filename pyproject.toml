[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service-gcp"
version = "0.1.0"
description = "Production-style RAG service: structured and unstructured ingestion, hybrid retrieval, grounded answers, tracing and LLM metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "pydantic>=2.7",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
gcp = ["google-genai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "google-genai>=1.0"]

[project.scripts]
ragservice = "ragservice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
